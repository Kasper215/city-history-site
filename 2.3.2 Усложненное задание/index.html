<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Персонажи Южного Парка, нарисованные средствами HTML и CSS без изображений.">
  <title>Южный Парк — CSS-персонажи</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="masthead">
      <p class="kicker">CSS illustration · HTML + CSS</p>
      <h1>Добро пожаловать<br><span>в Южный Парк</span></h1>
      <p class="intro">Зимняя встреча знакомых героев, собранных из простых форм и стилей.</p>
    </header>

    <section class="scene" aria-label="Зимний Южный Парк с четырьмя персонажами">
      <div class="sky" aria-hidden="true"></div>
      <div class="cloud cloud-one" aria-hidden="true"></div>
      <div class="cloud cloud-two" aria-hidden="true"></div>
      <div class="mountain mountain-back" aria-hidden="true"></div>
      <div class="mountain mountain-front" aria-hidden="true"></div>
      <div class="pine pine-one" aria-hidden="true"></div>
      <div class="pine pine-two" aria-hidden="true"></div>
      <div class="pine pine-three" aria-hidden="true"></div>
      <div class="snow-ground" aria-hidden="true"></div>

      <div class="cast">
        <figure class="person stan">
          <div class="character" aria-hidden="true">
            <div class="hat"><i class="pom"></i></div>
            <div class="head"><div class="face"><i class="eye left"></i><i class="eye right"></i><i class="nose"></i><i class="mouth"></i></div></div>
            <div class="body"><i class="arm left"></i><i class="arm right"></i><div class="coat"><i class="zipper"></i><i class="button b1"></i><i class="button b2"></i></div><div class="legs"><i></i><i></i></div></div>
          </div>
          <figcaption><strong>Стэн</strong><span>вечно в деле</span></figcaption>
        </figure>

        <figure class="person kyle">
          <div class="character" aria-hidden="true">
            <div class="hat"><i class="earflap left"></i><i class="earflap right"></i></div>
            <div class="head"><div class="face"><i class="ear left"></i><i class="ear right"></i><i class="eye left"></i><i class="eye right"></i><i class="nose"></i><i class="mouth"></i></div></div>
            <div class="body"><i class="arm left"></i><i class="arm right"></i><div class="coat"><i class="zipper"></i><i class="button b1"></i><i class="button b2"></i></div><div class="legs"><i></i><i></i></div></div>
          </div>
          <figcaption><strong>Кайл</strong><span>всё знает лучше</span></figcaption>
        </figure>

        <figure class="person cartman">
          <div class="character" aria-hidden="true">
            <div class="hat"><i class="band"></i><i class="pom"></i></div>
            <div class="head"><div class="face"><i class="eye left"></i><i class="eye right"></i><i class="nose"></i><i class="mouth"></i></div></div>
            <div class="body"><i class="arm left"></i><i class="arm right"></i><div class="coat"><i class="zipper"></i><i class="button b1"></i><i class="button b2"></i></div><div class="legs"><i></i><i></i></div></div>
          </div>
          <figcaption><strong>Картман</strong><span>главный по планам</span></figcaption>
        </figure>

        <figure class="person kenny">
          <div class="character" aria-hidden="true">
            <div class="hood"><div class="face"><i class="eye left"></i><i class="eye right"></i></div></div>
            <div class="body"><i class="arm left"></i><i class="arm right"></i><div class="coat"><i class="zipper"></i><i class="pocket"></i></div><div class="legs"><i></i><i></i></div></div>
          </div>
          <figcaption><strong>Кенни</strong><span>как всегда, загадка</span></figcaption>
        </figure>
      </div>
      <p class="scene-caption"><span class="caption-dot"></span>Маленький город · большие приключения</p>
    </section>

    <footer class="page-footer"><span>Персонажи нарисованы HTML и CSS</span><span>Без изображений и внешних библиотек</span></footer>
  </main>
</body>
</html>
